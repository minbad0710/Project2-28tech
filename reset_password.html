<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <body>
      <div class="page-account">
        <div class="form-account">
          <h1 class="inner-title">Đổi mật khẩu</h1>
          <p class="inner-desc">Vui lòng nhập mật khẩu để tiếp tục</p>
          <form class="inner-form" id="resetPasswordForm">
            <div class="inner-group">
              <label class="inner-label" for="password">Mật khẩu mới</label>
              <input class="inner-control" type="password" id="password" name="password">
            </div>
            <div class="inner-group">
              <label class="inner-label" for="confirmPassword">Xác nhận mật khẩu mới *</label>
              <input class="inner-control" type="password" id="confirmPassword" name="confirmPassword">
            </div>
            <button class="inner-button">Thay đổi</button>
          </form>
          <div class="inner-more"><span>Bạn đã nhớ mật khẩu?     </span><a href="#">Đăng nhập</a></div>
        </div>
      </div>
      <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>
      <script src="assets/JS/account.js"> </script>
    </body>
  </head>
</html>
