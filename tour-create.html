<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo tour  </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.tiny.cloud/1/nunk7rd3o8wt6vw4dnbfgaj2dt1b4jrnqrf50jy5o1d3nbf6/tinymce/8/tinymce.min.js" referrerpolicy="origin" crossorigin="anonymous"></script>
    <link href="https://unpkg.com/filepond@^4/dist/filepond.css" rel="stylesheet">
    <link href="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <body>
      <!--Header-->
      <header class="header">
        <div class="inner-left"><a class="inner-logo" href="#"><span>28</span><span>Admin</span></a></div>
        <div class="inner-right"> 
          <div class="inner-notify"> <img src="assets/imgs/icon-bell.svg"><span>6</span></div>
          <div class="inner-account"> <img src="assets/imgs/avatar.png">
            <div class="inner-text">
              <div class="inner-name">Le Van A </div>
              <div class="inner-role">Admin</div>
            </div>
          </div>
          <div class="inner-button-menu"> <i class="fa-solid fa-bars"></i></div>
        </div>
      </header>
      <!--End Header-->
      <main class="main">
        <!--Sider-->
        <nav class="sider">
          <div class="inner-list"><a class="inner-item active" href="#"><img src="assets/imgs/icon-sider-1.svg"><span>Tổng quan</span></a><a class="inner-item" href="#"><img src="assets/imgs/icon-sider-2.svg"><span>Quản lý danh mục</span></a><a class="inner-item" href="#"><img src="assets/imgs/icon-sider-3.svg"><span>Quản lý tour</span></a><a class="inner-item" href="#"><img src="assets/imgs/icon-sider-4.svg"><span>Quản lý đơn hàng</span></a><a class="inner-item" href="#"><img src="assets/imgs/icon-sider-5.svg"><span>Quản lý người dùng</span></a><a class="inner-item" href="#"><img src="assets/imgs/icon-sider-6.svg"><span>Thông tin liên hệ</span></a></div>
          <div class="inner-line"> </div>
          <div class="inner-list"> <a class="inner-item" href="#"><img src="assets/imgs/icon-sider-7.svg"><span>Cài đặt chung</span></a><a class="inner-item" href="#"><img src="assets/imgs/icon-sider-5.svg"><span>Thông tin cá nhân</span></a><a class="inner-item inner-logout" href="#"><img src="assets/imgs/icon-sider-8.svg"><span>Đăng xuất</span></a></div>
        </nav>
        <!--End sider-->
        <!--Content-->
        <div class="content">
          <h1 class="box-title">Tạo tour</h1>
          <!--Section 8-->
          <div class="section-8"> 
            <form id="tourCreateForm">
              <div class="inner-group">
                <label for="">Tên tour *</label>
                <input type="text" name="name" id="name">
              </div>
              <div class="inner-group"> 
                <label for="category">Danh mục</label>
                <select name="category" id="category">
                  <option value="">-- Chọn danh mục -- </option>
                  <option value="danh-muc-1">Danh mục 1</option>
                  <option value="danh-muc-2">Danh mục 2</option>
                </select>
              </div>
              <div class="inner-group"> 
                <label for="position">Vị trí</label>
                <input type="number" name="position" id="position">
              </div>
              <div class="inner-group"> 
                <label for="status">Trạng thái </label>
                <select> 
                  <option value="active">Hoạt động</option>
                  <option value="inactive">Tạm dừng </option>
                </select>
              </div>
              <div class="inner-group inner-two-col"> 
                <label for="avatar">Ảnh đại diện </label>
                <input type="file" name="avatar" id="avatar" filepond-image>
              </div>
              <div class="inner-group"> 
                <label>Giá cũ</label>
                <div class="inner-input-list"> 
                  <div class="inner-input-item">
                    <label for="priceAdult">Người lớn</label>
                    <input type="text" name="priceAdult" id="priceAdult">
                  </div>
                  <div class="inner-input-item">
                    <label for="priceChildren">Trẻ em</label>
                    <input type="text" name="priceChildren" id="priceChildren">
                  </div>
                  <div class="inner-input-item">
                    <label for="priceBaby">Em bé</label>
                    <input type="text" name="priceBaby" id="priceBaby">
                  </div>
                </div>
              </div>
              <div class="inner-group"> 
                <label>Giá mới</label>
                <div class="inner-input-list"> 
                  <div class="inner-input-item">
                    <label for="priceNewAdult">Người lớn</label>
                    <input type="text" name="priceNewAdult" id="priceNewAdult">
                  </div>
                  <div class="inner-input-item">
                    <label for="priceNewChildren">Trẻ em</label>
                    <input type="text" name="priceNewChildren" id="priceNewChildren">
                  </div>
                  <div class="inner-input-item">
                    <label for="priceNewBaby">Em bé</label>
                    <input type="text" name="priceNewBaby" id="priceNewBaby">
                  </div>
                </div>
              </div>
              <div class="inner-group"> 
                <label>Còn lại</label>
                <div class="inner-input-list"> 
                  <div class="inner-input-item">
                    <label for="stockAdult">Người lớn</label>
                    <input type="text" name="stockAdult" id="stockAdult">
                  </div>
                  <div class="inner-input-item">
                    <label for="stockChildren">Trẻ em</label>
                    <input type="text" name="stockChildren" id="stockChildren">
                  </div>
                  <div class="inner-input-item">
                    <label for="stockBaby">Em bé</label>
                    <input type="text" name="stockBaby" id="stockBaby">
                  </div>
                </div>
              </div>
              <div class="inner-group"> 
                <label>Những địa điểm có tour</label>
                <div class="inner-checkbox-list"> 
                  <div class="inner-checkbox-item">
                    <div class="checkbox-wrapper-30"><span class="checkbox">
                        <input type="checkbox" id="id-location-1" name="locations" value="id-location-1"/>
                        <svg>
                          <use class="checkbox" xlink:href="#checkbox-30"></use>
                        </svg></span>
                      <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
                        <symbol id="checkbox-30" viewBox="0 0 22 22">
                          <path d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2" stroke="currentColor" fill="none"></path>
                        </symbol>
                      </svg>
                    </div>
                    <label for="">Hà Nội</label>
                  </div>
                  <div class="inner-checkbox-item">
                    <div class="checkbox-wrapper-30"><span class="checkbox">
                        <input type="checkbox" id="id-location-2" name="locations" value="id-location-2"/>
                        <svg>
                          <use class="checkbox" xlink:href="#checkbox-30"></use>
                        </svg></span>
                      <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
                        <symbol id="checkbox-30" viewBox="0 0 22 22">
                          <path d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2" stroke="currentColor" fill="none"></path>
                        </symbol>
                      </svg>
                    </div>
                    <label for="">Đà Nẵng</label>
                  </div>
                  <div class="inner-checkbox-item">
                    <div class="checkbox-wrapper-30"><span class="checkbox">
                        <input type="checkbox" id="id-location-3" name="locations" value="id-location-3"/>
                        <svg>
                          <use class="checkbox" xlink:href="#checkbox-30"></use>
                        </svg></span>
                      <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
                        <symbol id="checkbox-30" viewBox="0 0 22 22">
                          <path d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2" stroke="currentColor" fill="none"></path>
                        </symbol>
                      </svg>
                    </div>
                    <label for="">Nha Trang</label>
                  </div>
                  <div class="inner-checkbox-item">
                    <div class="checkbox-wrapper-30"><span class="checkbox">
                        <input type="checkbox" id="id-location-4" name="locations" value="id-location-4"/>
                        <svg>
                          <use class="checkbox" xlink:href="#checkbox-30"></use>
                        </svg></span>
                      <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
                        <symbol id="checkbox-30" viewBox="0 0 22 22">
                          <path d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2" stroke="currentColor" fill="none"></path>
                        </symbol>
                      </svg>
                    </div>
                    <label for="">Hồ Chí Minh</label>
                  </div>
                </div>
              </div>
              <div class="inner-group">
                <label for="time">Thời gian</label>
                <input type="text" name="time" id="time">
              </div>
              <div class="inner-group">
                <label for="vehicle">Phương tiện</label>
                <input type="text" name="vehicle" id="vehicle">
              </div>
              <div class="inner-group">
                <label for="departureDate">Ngày khởi hành</label>
                <input type="text" name="departureDate" id="departureDate">
              </div>
              <div class="inner-group inner-two-col"> 
                <label for="information">Thông tin tour</label>
                <textarea name="information" id="information" textarea-mce></textarea>
              </div>
              <div class="inner-group inner-two-col"> 
                <label>Lịch trình tour</label>
                <div class="inner-schedule">
                  <div class="inner-schedule-list"> 
                    <div class="inner-schedule-item"> 
                      <div class="inner-schedule-head"> 
                        <div class="inner-schedule-button inner-move"><i class="fa-solid fa-arrows-up-down-left-right"></i></div>
                        <input type="text">
                        <div class="inner-schedule-button inner-remove"><i class="fa-regular fa-trash-can"></i></div>
                        <div class="inner-schedule-button inner-more"><i class="fa-solid fa-angle-down"></i></div>
                      </div>
                      <div class="inner-schedule-body">
                        <textarea textarea-mce></textarea>
                      </div>
                    </div>
                  </div>
                  <div class="inner-schedule-create">+ Thêm lịch trình</div>
                </div>
              </div>
              <div class="inner-group inner-two-col text-center"> 
                <button>Tạo mới</button>
              </div>
            </form>
            <div class="inner-link"> <a href="#">Quay lại danh sách </a></div>
          </div>
          <!--End section 8-->
        </div>
        <!--End content-->
      </main>
      <script src="https://unpkg.com/filepond@^4/dist/filepond.js"></script>
      <script src="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.js"></script>
      <script src="https://unpkg.com/filepond-plugin-file-validate-type/dist/filepond-plugin-file-validate-type.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"> </script>
      <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>
      <script src="assets/JS/script.js"></script>
    </body>
  </head>
</html>
